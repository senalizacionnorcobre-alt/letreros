<style>
/* Identidad NORCOBRE: verde corporativo, cobre del arco, blanco. */
:root{
  --verde:#1B7A37; --verde-osc:#0F5A27; --verde-claro:#E6F2E9;
  --cobre:#C8742A; --cobre-claro:#FBEEDF;
  --tinta:#1D2A24; --gris:#5F6B66; --linea:#D8E0DB; --fondo:#F3F6F4; --blanco:#FFFFFF;
  --ok:#1B7A37; --mal:#B3261E; --mal-claro:#FBE7E5; --aviso:#9A5A12;
  --f:"Roboto",Arial,sans-serif; --mono:"Roboto Mono",Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--fondo);color:var(--tinta);font:15px/1.5 var(--f)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cobre);outline-offset:2px}
[hidden]{display:none!important}

.top{background:var(--verde);color:#fff;position:relative;overflow:hidden;border-bottom:5px solid var(--cobre)}
.top::after{content:"";position:absolute;right:-120px;top:-160px;width:420px;height:420px;border-radius:50%;border:16px solid rgba(200,116,42,.55);pointer-events:none}
.top-in{max-width:1080px;margin:0 auto;padding:18px 16px;display:flex;align-items:center;gap:18px;position:relative;z-index:1}
.top img{height:58px;width:auto;flex:none}
.top h1{margin:0;font-weight:900;font-size:clamp(20px,3.4vw,28px);letter-spacing:.02em;text-transform:uppercase;line-height:1.1}
.top .lema{font-size:12.5px;font-style:italic;opacity:.9;margin-top:4px}
.top .tag{margin-left:auto;font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;background:rgba(255,255,255,.14);padding:7px 10px;border-radius:3px;white-space:nowrap}
@media (max-width:560px){.top .tag{display:none}.top img{height:46px}}

main{max-width:1080px;margin:0 auto;padding:22px 16px 48px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--blanco);border:1px solid var(--linea);border-radius:6px;padding:22px clamp(16px,3vw,28px);display:flex;flex-direction:column;gap:18px;min-width:0}
h2{margin:0;font-size:22px;font-weight:900;color:var(--verde-osc);text-wrap:balance;overflow-wrap:anywhere}
h3{margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--verde)}
.hint{color:var(--gris);font-size:13px;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--gris);text-transform:uppercase}
.field input,.field select,.field textarea,.cell input,.cell select{width:100%;min-width:0;border:1px solid var(--linea);background:#fff;border-radius:4px;padding:9px 11px}
.field textarea{min-height:90px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus,.cell input:focus,.cell select:focus{border-color:var(--verde);outline:none;box-shadow:0 0 0 3px var(--verde-claro)}
.req::after{content:" *";color:var(--cobre)}

.btn{border:1px solid var(--linea);background:#fff;border-radius:4px;padding:10px 16px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--tinta)}
.btn:hover{border-color:var(--verde)}
.btn.pri{background:var(--verde);border-color:var(--verde);color:#fff}
.btn.pri:hover{background:var(--verde-osc)}
.btn.cob{background:var(--cobre);border-color:var(--cobre);color:#fff}
.btn.mal{color:var(--mal);border-color:var(--mal)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--gris);padding:6px 8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.pill{display:inline-flex;align-items:center;gap:6px;font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:6px 9px;border-radius:3px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.t-info{background:var(--verde-claro);color:var(--verde-osc)}
.t-wait{background:var(--cobre-claro);color:var(--aviso)}
.t-ok{background:var(--verde);color:#fff}
.t-bad{background:var(--mal-claro);color:var(--mal)}

.head{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:flex-start}
.code{font:500 12px/1.3 var(--mono);color:var(--gris);letter-spacing:.04em}
.apcode{font:500 15px/1.2 var(--mono);color:var(--verde);font-weight:700;margin-top:4px}
dl.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 18px;margin:0}
dl.meta dt{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gris)}
dl.meta dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}

.route{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--linea);border-radius:6px;overflow:hidden}
.route li{padding:10px;font-size:12.5px;line-height:1.3;color:var(--gris);background:var(--fondo);border-right:1px solid var(--linea)}
.route li:last-child{border-right:0}
.route .n{display:block;font-weight:900;font-size:18px;margin-bottom:3px}
.route li.done{background:var(--verde-claro);color:var(--verde-osc)}
.route li.cur{background:#fff;color:var(--tinta);box-shadow:inset 0 -4px 0 var(--cobre)}
.route li.cur.bad{box-shadow:inset 0 -4px 0 var(--mal)}
@media (max-width:640px){.route{grid-template-columns:1fr}.route li{border-right:0;border-bottom:1px solid var(--linea);display:flex;gap:10px;align-items:baseline}.route li:last-child{border-bottom:0}.route .n{display:inline;margin:0}}

.action{border:1px solid var(--verde);background:var(--verde-claro);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
.action.wait{border-color:var(--linea);background:var(--fondo)}
.action.bad{border-color:var(--mal);background:var(--mal-claro)}
.action.ok{border-color:var(--verde);background:var(--verde-claro)}
.action .lead{margin:0;font-weight:700}
.action .sub{margin:0;font-size:13.5px;color:var(--gris)}

.items{border:1px solid var(--linea);border-radius:6px;overflow:hidden}
.irow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,.8fr) minmax(0,.8fr) minmax(0,.7fr) minmax(0,2.2fr);border-bottom:1px solid var(--linea)}
.irow:last-child{border-bottom:0}
.irow>div{padding:12px;min-width:0;overflow-wrap:anywhere}
.ihead{background:var(--verde);color:#fff}
.ihead>div{padding-block:9px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.ityp b{display:block}
.imod.pend{background:var(--cobre-claro)}
.ml{display:none;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--gris);margin-bottom:3px}
@media (max-width:760px){.ihead{display:none}.irow{grid-template-columns:repeat(3,minmax(0,1fr))}.irow>.ityp,.irow>.imod{grid-column:1/-1}.irow>div{padding:8px 12px}.ml{display:block}}
.files{display:flex;flex-wrap:wrap;gap:10px}
.file{width:132px;border:1px solid var(--linea);border-radius:4px;overflow:hidden;background:var(--fondo)}
.file a{display:block;color:inherit;text-decoration:none}
.thumb{height:92px;display:grid;place-items:center;overflow:hidden;background:#fff}
.thumb img{width:100%;height:100%;object-fit:contain}
.thumb .pdf{font-weight:900;color:var(--mal);letter-spacing:.05em}
.fn{font-size:11px;padding:5px 7px;border-top:1px solid var(--linea);display:flex;justify-content:space-between;gap:4px;align-items:center}
.fn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{border:0;background:none;color:var(--gris);cursor:pointer;font-size:15px;padding:0 2px}
.x:hover{color:var(--mal)}
.drop{width:132px;min-height:120px;border:2px dashed var(--cobre);border-radius:4px;display:grid;place-items:center;text-align:center;font-size:12px;color:var(--aviso);cursor:pointer;padding:8px;background:#fff}
.drop:hover,.drop.over{background:var(--cobre-claro)}
.missing{font-size:12.5px;color:var(--aviso);margin-top:8px;font-weight:500}

.editor{display:flex;flex-direction:column;gap:10px}
.erow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1.1fr) 100px minmax(0,1fr) 34px;gap:8px;align-items:end}
.cell{display:flex;flex-direction:column;gap:4px;min-width:0}
.cell>span{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--gris)}
@media (max-width:760px){.erow{grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding-bottom:12px;border-bottom:1px solid var(--linea)}}

.approvals{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.ap{border:1px solid var(--linea);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ap .role{font-weight:900;text-transform:uppercase;color:var(--verde-osc);letter-spacing:.03em}
.ap .who{font-size:13.5px;overflow-wrap:anywhere}
.ap .when{font:500 11.5px/1.3 var(--mono);color:var(--gris)}
.ap .note{margin:0;font-size:13.5px;font-style:italic;overflow-wrap:anywhere}
.st-ok{color:var(--ok);font-weight:900}
.st-bad{color:var(--mal);font-weight:900}

.log{list-style:none;margin:0 0 0 6px;padding:0;border-left:2px solid var(--linea)}
.log li{padding:0 0 10px 14px;position:relative;font-size:13.5px}
.log li::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--cobre)}
.log .w{font:500 11px/1.4 var(--mono);color:var(--gris)}
.log .nt{color:var(--gris);font-style:italic;overflow-wrap:anywhere}

.done-box{text-align:center;padding:30px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.done-box .big{font:700 22px/1.2 var(--mono);color:var(--verde)}
.linkbox{width:100%;max-width:640px;display:flex;gap:8px}
.linkbox input{flex:1;min-width:0;border:1px solid var(--linea);border-radius:4px;padding:8px 10px;font-size:12.5px}

.tbl-wrap{overflow-x:auto;border:1px solid var(--linea);border-radius:6px}
table.tbl{border-collapse:collapse;width:100%;min-width:760px;font-size:13.5px}
.tbl th{background:var(--verde);color:#fff;text-align:left;padding:9px 10px;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--linea);vertical-align:top}
.tbl tr:hover td{background:var(--fondo)}
.tbl .mono{font-family:var(--mono);font-size:12px}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{border:1px solid var(--linea);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px}
.filters button[aria-pressed="true"]{background:var(--verde);border-color:var(--verde);color:#fff}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:11px 18px;border-radius:5px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:9}
.toast.err{background:var(--mal)}
.busy{position:fixed;inset:0;background:rgba(255,255,255,.55);display:grid;place-items:center;z-index:8}
.busy div{background:#fff;border:1px solid var(--linea);border-left:5px solid var(--cobre);padding:14px 20px;border-radius:5px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.12)}
footer{text-align:center;color:var(--gris);font-size:12px;padding:0 16px 30px}
.pv-overlay{position:fixed;inset:0;background:rgba(15,40,25,.55);z-index:7;overflow-y:auto;padding:24px 16px}
.pv-sheet{background:#fff;max-width:820px;margin:0 auto;border-radius:6px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.pv-head{background:var(--verde);color:#fff;display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:5px solid var(--cobre)}
.pv-head img{height:44px}
.pv-t{font-weight:900;font-size:16px;letter-spacing:.03em}
.pv-s{font-size:12.5px;opacity:.9}
.pv-body{padding:18px 22px;display:flex;flex-direction:column;gap:12px}
.pv-body .lbl{margin:0}
.pv-meta{border-collapse:collapse;width:100%;font-size:13.5px}
.pv-meta td{padding:4px 10px 4px 0;vertical-align:top;overflow-wrap:anywhere}
.pk{color:var(--gris);white-space:nowrap;width:1%}
.pv{font-weight:700}
.pv-band{background:var(--verde);color:#fff;font-weight:700;padding:8px 12px;border-bottom:4px solid var(--cobre);margin-top:6px}
.pv-item{display:flex;flex-wrap:wrap;gap:16px 24px;padding:12px 0;border-bottom:1px solid var(--linea)}
.pv-draw{display:flex;flex-direction:column;align-items:flex-end}
.pv-w,.pv-h{color:var(--cobre);font-weight:700;font-size:12.5px;text-align:center}
.pv-w{align-self:stretch;padding-left:64px;margin-bottom:4px}
.pv-row{display:flex;align-items:center;gap:8px}
.pv-h{width:56px}
.pv-frame{border:2px solid var(--verde);display:grid;place-items:center;background:#fff;max-width:calc(100vw - 140px)}
.pv-frame img{display:block}
.pv-info{flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px}
.pv-info table{border-collapse:collapse;font-size:13.5px}
.pv-info td{padding:3px 10px 3px 0}
.pv-actions{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;padding:14px 22px;background:var(--fondo);border-top:1px solid var(--linea)}
</style>
</head>

function mimeOf(f){ if (ACCEPT.split(',').includes(f.type)) return f.type; const ext = f.name.split('.').pop().toLowerCase(); return {pdf:'application/pdf', png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif', webp:'image/webp'}[ext] || ''; }

    const inp = h('input',{type:'file', accept:ACCEPT, multiple:true, hidden:true, id:'nf_'+it.id, onchange:e=>{

      h('label',{class:'cell'}, h('span',null,'Tipo de letrero'), sel(B.lists.tipos, it.type, 'Elegir tipo…', e=>it.type=e.target.value)),
      h('label',{class:'cell'}, h('span',null,'Orientación'), sel(['Vertical','Horizontal'], it.orient, 'Elegir…', e=>it.orient=e.target.value)),
      h('div',{class:'cell'}, h('span',null,'Medidas (cm)'), sel(B.lists.medidas, it.size, 'Elegir…', e=>{ it.size=e.target.value; other.hidden = it.size!=='Otros'; if(!other.hidden) other.focus(); }), other),
      h('label',{class:'cell'}, h('span',null,'Cantidad'), h('input',{value:it.qty||'', placeholder:'Ej. 4', oninput:e=>it.qty=e.target.value})),
      h('div',{class:'cell'}, h('span',null,'Modelo de letrero'), h('label',{class:'btn' + (it.files.length ? '' : ' cob'), for:'nf_'+it.id, style:'justify-content:center'}, it.files.length ? '+ Otro archivo' : '+ Adjuntar modelo'), inp, names),
      h('button',{class:'btn ghost', type:'button', title:'Quitar letrero', 'aria-label':'Quitar letrero', disabled: newItems.length===1 || null, onclick:()=>{ newItems.splice(i,1); redraw(); }}, '×')));

    h('span',{class:'hint'}, 'Una fila por cada tipo de letrero. Modelo en PNG, JPG o PDF de hasta 10 MB.')));
  return wrap;

function pickOk(){
  const need = [[draft.name.trim(), 'tu nombre'], [/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(draft.email.trim()), 'un correo válido'], [draft.title.trim(), 'para qué son los letreros'],
    [draft.empresa && (draft.empresa !== 'OTROS' || draft.empresaOtro.trim()), 'la compañía o empresa'], [draft.area && (draft.area !== 'OTROS' || draft.areaOtro.trim()), 'el área'],
    [draft.zona, 'la zona'], [draft.reviewer, 'el revisor']];
  const miss = need.find(x => !x[0]);
  if (miss){ toast('Falta indicar ' + miss[1] + '.', true); return false; }
  return true;
}
function dimsOf(it){
  const m = String(sizeLabel(it)).match(/(\d+(?:[.,]\d+)?)\s*[x×*]\s*(\d+(?:[.,]\d+)?)/i);
  if (!m) return null;
  const a = parseFloat(m[1].replace(',', '.')), b = parseFloat(m[2].replace(',', '.')), lo = Math.min(a, b), hi = Math.max(a, b);
  return it.orient === 'Horizontal' ? {w:hi, h:lo} : {w:lo, h:hi};
}
function showPreview(){
  const val = (s, o) => s === 'OTROS' ? o : s;
  const urls = [];
  const row = (k, v) => h('tr', null, h('td', {class:'pk'}, k), h('td', {class:'pv'}, v || '—'));
  const items = newItems.map((it, i) => {
    const d = dimsOf(it), box = 220;
    const fw = d ? Math.round(d.w >= d.h ? box : box * d.w / d.h) : box, fh = d ? Math.round(d.h >= d.w ? box : box * d.h / d.w) : Math.round(box * .7);
    const imgF = it.files.find(f => mimeOf(f).startsWith('image/'));
    let inner;
    if (imgF){ const u = URL.createObjectURL(imgF); urls.push(u); inner = h('img', {src:u, alt:imgF.name, style:`max-width:${fw - 10}px;max-height:${fh - 10}px`}); }
    else inner = h('span', {class:'hint'}, it.files[0] ? 'Modelo: ' + it.files[0].name : 'Sin modelo');
    return h('div', {class:'pv-item'},
      h('div', {class:'pv-draw'},
        h('div', {class:'pv-w'}, '← ', d ? `Ancho ${d.w} cm` : sizeLabel(it) + ' cm', ' →'),
        h('div', {class:'pv-row'}, h('div', {class:'pv-h'}, d ? ['↑', h('br'), 'Alto', h('br'), `${d.h} cm`, h('br'), '↓'] : ''), h('div', {class:'pv-frame', style:`width:${fw}px;height:${fh}px`}, inner))),
      h('div', {class:'pv-info'}, h('span', {class:'code'}, `Letrero ${i + 1}`), h('b', null, it.type),
        h('table', null, row('Orientación', it.orient), row('Medidas', sizeLabel(it) + ' cm'), d ? row('Ancho × Alto', `${d.w} × ${d.h} cm`) : null, row('Cantidad', it.qty)),
        it.files.length > 1 ? h('span', {class:'hint'}, `${it.files.length} archivos adjuntos`) : null));
  });
  const close = () => { urls.forEach(u => URL.revokeObjectURL(u)); ov.remove(); document.body.style.overflow = ''; };
  const ov = h('div', {class:'pv-overlay', role:'dialog', 'aria-modal':'true', 'aria-label':'Vista preliminar de la solicitud'},
    h('div', {class:'pv-sheet'},
      h('div', {class:'pv-head'}, h('img', {src:document.querySelector('.top img').src, alt:'NORCOBRE'}),
        h('div', null, h('div', {class:'pv-t'}, 'VISTA PRELIMINAR DE LA SOLICITUD'), h('div', {class:'pv-s'}, 'Revisa tus datos y los modelos antes de enviar'))),
      h('div', {class:'pv-body'},
        h('p', {class:'lbl'}, 'Letreros para'), h('h2', null, draft.title),
        h('table', {class:'pv-meta'}, row('Solicitante', draft.name + ' · ' + draft.email), row('Compañía / empresa', val(draft.empresa, draft.empresaOtro)),
          row('Área', val(draft.area, draft.areaOtro)), row('Zona', draft.zona), row('Revisor', draft.reviewer), row('Fecha requerida', fmtDate(draft.neededBy)), row('Prioridad', draft.priority)),
        draft.reason ? h('p', {style:'margin:0'}, h('b', null, 'Motivo: '), draft.reason) : null,
        h('div', {class:'pv-band'}, `MODELOS DE LETREROS · MEDIDAS (${newItems.length})`),
        items),
      h('div', {class:'pv-actions'},
        h('button', {class:'btn', type:'button', onclick:close}, '← Corregir'),
        h('button', {class:'btn pri', type:'button', onclick:() => { close(); sendAll(); }}, 'Confirmar y enviar'))));
  document.body.append(ov); document.body.style.overflow = 'hidden';
  ov.querySelector('.pv-actions .pri').focus();
}
async function submitAll(){
  if (!pickOk()) return;
  for (const [n, it] of newItems.entries()){
    const miss = !it.type ? 'el tipo' : !it.orient ? 'la orientación' : !sizeLabel(it) ? 'las medidas' : !String(it.qty||'').trim() ? 'la cantidad' : !it.files.length ? 'el modelo adjunto' : null;
    if (miss) return toast(`Letrero ${n+1}: falta ${miss}.`, true);
  }
  showPreview();
}
async function sendAll(){
  let out;
  try { out = await act('Registrando solicitud…', 'apiSubmit', Object.assign({}, draft, {items: newItems.map(({files, ...x}) => x)})); } catch(_){ return; }
  const total = newItems.reduce((s, it) => s + it.files.length, 0);
  let k = 0, failed = 0;
  for (const it of newItems) for (const f of it.files){
    k++; busy(true, `Subiendo modelo ${k} de ${total}…`);
    try { await call('apiUpload', out.id, out.token, it.id, {name:f.name, mime:mimeOf(f), data: await readB64(f)}); } catch(e){ failed++; }
  }
  if (!failed){ busy(true, 'Enviando a revisión…'); try { await call('apiSendReview', out.id, out.token); } catch(e){ failed = -1; } }
  busy(false);
  B.view='hecho'; B.done=Object.assign(out, {failed}); render(); window.scrollTo(0,0);
}

/* ---------- detalle ---------- */
function detail(r){
  const role = B.role, out = [];
  const card = h('section',{class:'card'});
  card.append(
    h('div',{class:'head'},
      h('div',{style:'min-width:0'}, h('div',{class:'code'}, r.code), r.approvalCode ? h('div',{class:'apcode'}, 'Código de aprobación: ', r.approvalCode) : null, h('h2',{style:'margin-top:4px'}, r.title)),
      pill(r.status)),
    h('dl',{class:'meta'},
      mt('Solicitante', r.requester.name), mt('Compañía / empresa', r.empresa), mt('Área', r.area), mt('Zona', r.zona),
      mt('Revisor', r.reviewer), mt('Fecha requerida', fmtDate(r.neededBy)), mt('Prioridad', r.priority), mt('Registrada', fmtDate(r.createdAt))),
    r.reason ? h('p',{style:'margin:0;white-space:pre-wrap'}, r.reason) : null,
    route(r),
    actionCard(r, role));
  out.push(card);

  const showEditor = (role==='jefe' || role==='sol') && editing && ['por_adjuntar','observada'].includes(r.status);
  if (showEditor) out.push(h('section',{class:'card'}, h('h3',{style:'margin:0'},'Letreros a solicitar'), itemEditor(r)));
  else if (r.items.length) out.push(h('section',{class:'card'}, h('h3',{style:'margin:0'}, `Letreros (${r.items.length})`), itemsTable(r, role)));

  if (r.review || r.final || ['en_revision','aprobacion_final','aprobada'].includes(r.status)) out.push(h('section',{class:'card'}, h('h3',{style:'margin:0'},'Aprobaciones'), approvals(r, role)));
  out.push(h('section',{class:'card'}, h('h3',{style:'margin:0'},'Historial'),
    h('ul',{class:'log'}, [...r.history].reverse().map(x => h('li',null, h('div',{class:'w'}, fmtWhen(x.at), ' · ', x.who), h('div',null, x.action), x.note ? h('div',{class:'nt'}, '“', x.note, '”') : null)))));
  return out;
}

      h('div',{class:'btns'},
        h('button',{class:'btn pri', disabled: missing || null, onclick: async () => { try { const o = await act('Enviando a revisión…','apiSendReview', r.id, B.token); req=o.req; render(); toast(o.msg); } catch(_){} }}, 'Enviar a revisión del Ing. SSO'),

    : box('wait', `En revisión: esperando a ${r.reviewer}.`, r.reviewerBackup ? `Suplente: ${r.reviewerBackup}. Con la aprobación pasa al Jefe de SSO.` : 'Con su aprobación pasa al Jefe de SSO.');

      h('div',{class:'imod'+(canAttach && !it.files.length ? ' pend' : '')}, lab('Modelo de letrero'),
        (files.length || drop) ? h('div',{class:'files'}, files, drop) : h('span',{class:'hint'},'Sin modelo'),
        canAttach && !it.files.length ? h('div',{class:'missing'}, 'Carga aquí el modelo de este letrero.') : null));
  });
  return h('div',{class:'items'},
    h('div',{class:'irow ihead', 'aria-hidden':'true'}, h('div',null,'Tipo de letrero'), h('div',null,'Orientación'), h('div',null,'Medidas'), h('div',null,'Cantidad'), h('div',null,'Modelo de letrero')),
    rows);
}
function readB64(file){ return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(file); }); }
async function upload(r, itemId, files){
  if (!files.length) return;
  uploading[itemId] = true; render();
  for (const f of files){
    let mime = f.type;
    if (!ACCEPT.split(',').includes(mime)){ const ext = f.name.split('.').pop().toLowerCase(); mime = {pdf:'application/pdf', png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif', webp:'image/webp'}[ext]; }
    if (!mime){ toast(`"${f.name}": formato no admitido. Usa PNG, JPG o PDF.`, true); continue; }
    if (f.size > 10*1024*1024){ toast(`"${f.name}" supera 10 MB.`, true); continue; }
    try { const data = await readB64(f); const o = await act('Subiendo ' + f.name + '…', 'apiUpload', r.id, B.token, itemId, {name:f.name, mime, data}); req = o.req; }
    catch(_){}
  }
  uploading[itemId] = false; render();
}
async function removeFile(r, itemId, fileId){
  try { const o = await act('Quitando archivo…','apiRemoveFile', r.id, B.token, itemId, fileId); req = o.req; render(); } catch(_){}
}

/* ---------- editor del Jefe de SSO ---------- */
function itemEditor(r){
  if (!itemDraft) itemDraft = r.items.length ? JSON.parse(JSON.stringify(r.items)) : [blank()];
  const rows = itemDraft;
  const sel = (list, val, ph, on) => h('select',{onchange:on}, h('option',{value:''}, ph), list.map(o => opt(o, val, o==='Otros' ? 'Otros (escribir)' : o)));
  return h('div',{class:'editor'},
    rows.map((it, i) => {
      const other = h('input',{value:it.sizeOtro||'', placeholder:'Ej. 50 x 70', 'aria-label':'Otra medida', oninput:e=>it.sizeOtro=e.target.value});
      other.hidden = it.size!=='Otros';
      return h('div',{class:'erow'},
        h('label',{class:'cell'}, h('span',null,'Tipo de letrero'), sel(B.lists.tipos, it.type, 'Elegir tipo…', e=>it.type=e.target.value)),
        h('label',{class:'cell'}, h('span',null,'Orientación'), sel(['Vertical','Horizontal'], it.orient, 'Elegir…', e=>it.orient=e.target.value)),
        h('div',{class:'cell'}, h('span',null,'Medidas (cm)'), sel(B.lists.medidas, it.size, 'Elegir…', e=>{ it.size=e.target.value; other.hidden = it.size!=='Otros'; if(!other.hidden) other.focus(); }), other),
        h('label',{class:'cell'}, h('span',null,'Cantidad'), h('input',{value:it.qty||'', placeholder:'Ej. 4', oninput:e=>it.qty=e.target.value})),
        h('div',{class:'cell'}, h('span',null,'Modelo de letrero'), h('span',{class:'hint', style:'padding:9px 0'}, 'Se adjunta en la tabla')),
        h('button',{class:'btn ghost', type:'button', title:'Quitar letrero', 'aria-label':'Quitar letrero', disabled: rows.length===1 || null, onclick:()=>{ rows.splice(i,1); render(); }}, '×'));
    }),
    h('div',{class:'btns'},
      h('button',{class:'btn', type:'button', onclick:()=>{ rows.push(blank()); render(); }}, '+ Agregar letrero'),
      h('button',{class:'btn pri', type:'button', onclick: async ()=>{
        try { const o = await act('Guardando…','apiSaveItems', r.id, B.token, rows); req=o.req; editing=false; itemDraft=null; render(); toast(o.msg); } catch(_){}
      }}, r.status==='solicitada' ? 'Enviar al solicitante' : 'Guardar cambios'),
      editing ? h('button',{class:'btn ghost', type:'button', onclick:()=>{ editing=false; itemDraft=null; render(); }}, 'Cancelar') : null));
}
const blank = () => ({id:rid(), type:'', orient:'', size:'', sizeOtro:'', qty:'', files:[]});

/* ---------- aprobaciones ---------- */
const form = {name:'', comment:''};
function approvals(r, role){
  const rv = r.review, fn = r.final;
  const stEl = d => h('span',{class: d==='Aprobado' ? 'st-ok' : 'st-bad'}, d.toUpperCase());
  const decideEl = (withName, fnName, okLabel) => h('div',{class:'editor'},
    withName ? h('div',{class:'field'}, h('label',{class:'req', for:'dName'}, 'Nombre del revisor'), (B.reviewerNames||[]).length
      ? h('select',{id:'dName', onchange:e=>form.name=e.target.value}, h('option',{value:''},'Elegir tu nombre…'), B.reviewerNames.map(n => opt(n, form.name, n)))
      : h('input',{id:'dName', value:form.name, placeholder:'Nombre y apellido', oninput:e=>form.name=e.target.value})) : null,
    h('div',{class:'field'}, h('label',{for:'dCom'}, 'Comentario (obligatorio para observar)'), h('textarea',{id:'dCom', oninput:e=>form.comment=e.target.value}, form.comment)),
    h('div',{class:'btns'},
      h('button',{class:'btn pri', onclick:()=>decide(fnName, 'aprobado')}, okLabel),
      h('button',{class:'btn mal', onclick:()=>decide(fnName, 'observado')}, 'Observar')));
  const revActive = r.status==='en_revision';
  const finActive = r.status==='aprobacion_final';
  const revCard = h('div',{class:'ap'},
    h('div',{class:'btns', style:'justify-content:space-between'}, h('span',{class:'role'}, 'Ing. SSO ' + r.zona), rv ? stEl(rv.decision) : h('span',{class:'pill '+(revActive?'t-wait':'t-info')}, revActive ? 'Pendiente' : 'En espera')),
    h('div',{class:'who'}, 'Revisor: ', r.reviewer, r.reviewerBackup ? h('span',{class:'hint'}, ' · suplente: ' + r.reviewerBackup) : null),
    rv ? h('div',{class:'who'}, h('span',{class:'lbl'}, 'Revisado por '), h('b',null, rv.name), rv.asBackup ? ' (suplente)' : '') : null,
    rv ? h('div',{class:'when'}, fmtWhen(rv.at)) : null,
    rv && rv.comment ? h('p',{class:'note'}, '“', rv.comment, '”') : null,
    revActive && (role==='rev' || role==='sup') ? decideEl(true, 'apiReview', 'Aprobar') : null);
  const finCard = h('div',{class:'ap'},
    h('div',{class:'btns', style:'justify-content:space-between'}, h('span',{class:'role'}, 'Jefe de SSO'), fn ? stEl(fn.decision) : h('span',{class:'pill '+(finActive?'t-wait':'t-info')}, finActive ? 'Pendiente' : 'En espera')),
    fn && fn.name ? h('div',{class:'who'}, h('span',{class:'lbl'}, 'Aprobado por '), h('b',null, fn.name)) : null,
    fn ? h('div',{class:'when'}, fmtWhen(fn.at)) : null,
    fn && fn.comment ? h('p',{class:'note'}, '“', fn.comment, '”') : null,
    r.approvalCode ? h('div',{class:'apcode'}, r.approvalCode) : null,
    finActive && role==='jefe' ? decideEl(false, 'apiFinal', 'Aprobar solicitud') : null);
  return h('div',{class:'approvals'}, revCard, finCard);
}
async function decide(fnName, decision){
  if (fnName==='apiReview' && !form.name.trim()) return toast((B.reviewerNames||[]).length ? 'Elige tu nombre en "Nombre del revisor".' : 'Escribe tu nombre en "Nombre del revisor".', true);
  if (fnName==='apiReview' && !(B.reviewerNames||[]).length && form.name.trim().split(/\s+/).length < 2) return toast('Escribe tu nombre y apellido.', true);
  if (decision==='observado' && !form.comment.trim()) return toast('Escribe qué hay que corregir antes de observar.', true);
  try {
    const o = await act(decision==='aprobado' ? 'Registrando aprobación…' : 'Enviando observación…', fnName, req.id, B.token, {name:form.name, comment:form.comment, decision});
    req = o.req; form.name=''; form.comment=''; render(); toast(o.msg); window.scrollTo(0,0);
  } catch(_){}
}

/* ---------- panel del Jefe de SSO ---------- */
let adminFilter = 'pend';
function adminView(){
  const list = B.list || [];
  const pend = s => ['solicitada','aprobacion_final'].includes(s);
  const shown = list.filter(x => adminFilter==='all' ? true : adminFilter==='pend' ? pend(x.status) : x.status===adminFilter);
  const fb = (k, l) => h('button',{'aria-pressed': adminFilter===k ? 'true':'false', onclick:()=>{ adminFilter=k; render(); }}, l);
  return h('section',{class:'card'},
    h('div',{class:'head'}, h('div',null, h('h2',null,'Panel del Jefe de SSO'), h('p',{class:'hint', style:'margin-top:4px'}, `${list.length} solicitudes registradas. Todo se guarda también en la hoja de Google Sheets.`)),
      h('a',{class:'btn', href:B.url}, '+ Nueva solicitud')),
    h('div',{class:'filters'}, fb('pend','Te toca'), fb('en_revision','En revisión'), fb('observada','Observadas'), fb('aprobada','Aprobadas'), fb('all','Todas')),
    shown.length ? h('div',{class:'tbl-wrap'}, h('table',{class:'tbl'},
      h('thead',null, h('tr',null, ['Solicitud','Código aprobación','Letreros para','Empresa / Área','Zona','Solicitante','Estado',''].map(t => h('th',null,t)))),
      h('tbody',null, shown.map(x => h('tr',null,
        h('td',{class:'mono'}, x.code, h('br'), h('span',{class:'hint'}, fmtDate(x.createdAt))),
        h('td',{class:'mono'}, x.approvalCode || '—'),
        h('td',null, x.title),
        h('td',null, x.empresa, h('br'), h('span',{class:'hint'}, x.area)),
        h('td',null, x.zona),
        h('td',null, x.requester),
        h('td',null, pill(x.status)),
        h('td',null, h('a',{class:'btn', href:x.link}, 'Abrir')))))))
    : h('p',{class:'hint'}, 'No hay solicitudes en este filtro.'));
}

render();
});
</script>
